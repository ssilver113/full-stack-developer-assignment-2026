spring:
  application:
    name: user-management-api

  datasource:
    # File-based, so data survives a restart and Flyway's version tracking is
    # observable rather than re-applied on every boot.
    url: jdbc:h2:file:./data/usersdb
    username: sa
    password: ""

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it, so
      # drift fails at startup instead of diverging silently.
      ddl-auto: validate
    # Keeping the persistence context open for the whole request makes lazy
    # loading work by accident and hides an endpoint's real query cost.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: dev

  # The module providing this is developmentOnly, so it cannot reach a built jar.
  h2:
    console:
      enabled: true
