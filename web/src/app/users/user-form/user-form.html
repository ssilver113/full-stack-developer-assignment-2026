<h1>{{ isEdit() ? 'Edit user' : 'Create user' }}</h1>

@if (error(); as message) {
  <p class="alert" role="alert">{{ message }}</p>
}

<form class="user-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="user-form__field">
    <label for="firstName">First name</label>
    <input
      id="firstName"
      type="text"
      formControlName="firstName"
      autocomplete="given-name"
      [attr.aria-invalid]="errorFor('firstName') ? true : null"
    />
    @if (errorFor('firstName'); as message) {
      <p class="user-form__error" role="alert">{{ message }}</p>
    }
  </div>

  <div class="user-form__field">
    <label for="lastName">Last name</label>
    <input
      id="lastName"
      type="text"
      formControlName="lastName"
      autocomplete="family-name"
      [attr.aria-invalid]="errorFor('lastName') ? true : null"
    />
    @if (errorFor('lastName'); as message) {
      <p class="user-form__error" role="alert">{{ message }}</p>
    }
  </div>

  <div class="user-form__field">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="errorFor('email') ? true : null"
    />
    @if (errorFor('email'); as message) {
      <p class="user-form__error" role="alert">{{ message }}</p>
    }
  </div>

  <div class="user-form__actions">
    <button class="button button--primary" type="submit" [disabled]="saving()">
      {{ isEdit() ? 'Save changes' : 'Create user' }}
    </button>
    <a class="button" routerLink="/users">Cancel</a>
  </div>
</form>
